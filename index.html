<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator ICER Plane Interaktif</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 900px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .app-layout {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .controls {
            flex: 1;
            min-width: 250px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .chart-container {
            flex: 2;
            min-width: 400px;
            position: relative;
            height: 400px;
        }
        .slider-group {
            margin-bottom: 20px;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }
        .terima { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .tolak { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h1>Bidang Efektivitas Biaya (ICER Plane)</h1>
    <p class="subtitle">Simulasi Interaktif Keputusan Penilaian Teknologi Kesehatan (HTA)</p>

    <div class="app-layout">
        <div class="controls">
            <div class="slider-group">
                <label>
                    <span>Selisih Efek / ΔQALY</span>
                    <span id="val-qaly">0.0</span>
                </label>
                <input type="range" id="slider-qaly" min="-5" max="5" step="0.1" value="1.5">
            </div>

            <div class="slider-group">
                <label>
                    <span>Selisih Biaya (Juta Rp) / ΔCost</span>
                    <span id="val-cost">0</span>
                </label>
                <input type="range" id="slider-cost" min="-100" max="100" step="1" value="20">
            </div>

            <hr style="border:0; border-top:1px solid #ddd; margin: 20px 0;">

            <div class="slider-group">
                <label>
                    <span>Ambang Batas WTP (Juta/QALY)</span>
                    <span id="val-wtp">30</span>
                </label>
                <input type="range" id="slider-wtp" min="0" max="100" step="1" value="30">
            </div>

            <div id="decision-box" class="result-box">
                Mengevaluasi...
            </div>
        </div>

        <div class="chart-container">
            <canvas id="icerChart"></canvas>
        </div>
    </div>
    
    <div style="text-align: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; color: #95a5a6; font-size: 0.9em; font-style: italic;">
        ✨ Perubahan berhasil! Teks ini baru saja ditambahkan dari IDE dan langsung diperbarui oleh Vercel.
    </div>
</div>

<script>
    // Ambil elemen DOM
    const sliderQALY = document.getElementById('slider-qaly');
    const sliderCost = document.getElementById('slider-cost');
    const sliderWTP = document.getElementById('slider-wtp');
    const valQALY = document.getElementById('val-qaly');
    const valCost = document.getElementById('val-cost');
    const valWTP = document.getElementById('val-wtp');
    const decisionBox = document.getElementById('decision-box');

    // Inisialisasi Grafik Chart.js
    const ctx = document.getElementById('icerChart').getContext('2d');
    const icerChart = new Chart(ctx, {
        type: 'scatter',
        data: {
            datasets: [
                {
                    label: 'Intervensi',
                    data: [{ x: parseFloat(sliderQALY.value), y: parseFloat(sliderCost.value) }],
                    backgroundColor: 'rgba(52, 152, 219, 1)',
                    borderColor: '#2980b9',
                    pointRadius: 8,
                    pointHoverRadius: 10,
                    pointStyle: 'circle'
                },
                {
                    label: 'Garis WTP',
                    data: [
                        { x: -5, y: -5 * parseFloat(sliderWTP.value) },
                        { x: 5, y: 5 * parseFloat(sliderWTP.value) }
                    ],
                    type: 'line',
                    borderColor: 'rgba(46, 204, 113, 0.8)',
                    borderWidth: 2,
                    borderDash: [5, 5],
                    fill: false,
                    pointRadius: 0
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    min: -5,
                    max: 5,
                    title: { display: true, text: 'Selisih Efektivitas (ΔQALY)', font: {weight: 'bold'} },
                    grid: { color: (ctx) => ctx.tick.value === 0 ? 'rgba(0,0,0,0.5)' : 'rgba(0,0,0,0.05)', lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1 }
                },
                y: {
                    min: -100,
                    max: 100,
                    title: { display: true, text: 'Selisih Biaya (ΔCost)', font: {weight: 'bold'} },
                    grid: { color: (ctx) => ctx.tick.value === 0 ? 'rgba(0,0,0,0.5)' : 'rgba(0,0,0,0.05)', lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1 }
                }
            },
            plugins: {
                legend: { position: 'bottom' },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            if (context.datasetIndex === 0) {
                                return `ΔQALY: ${context.parsed.x}, ΔCost: Rp ${context.parsed.y} Juta`;
                            }
                            return `Garis WTP`;
                        }
                    }
                }
            }
        }
    });

    // Fungsi Utama untuk Update Tampilan & Logika
    function updateApp() {
        const dE = parseFloat(sliderQALY.value);
        const dC = parseFloat(sliderCost.value);
        const wtp = parseFloat(sliderWTP.value);

        // Update teks angka di UI
        valQALY.textContent = dE.toFixed(1);
        valCost.textContent = dC;
        valWTP.textContent = wtp;

        // Update Titik Intervensi pada Grafik
        icerChart.data.datasets[0].data = [{ x: dE, y: dC }];
        
        // Update Garis WTP pada Grafik
        icerChart.data.datasets[1].data = [
            { x: -5, y: -5 * wtp },
            { x: 5, y: 5 * wtp }
        ];
        icerChart.update();

        // Logika Keputusan HTA (Menentukan Kuadran)
        let decisionText = "";
        let isAccepted = false;

        if (dE > 0 && dC < 0) {
            decisionText = "Kuadran Tenggara (DOMINANT):<br>Lebih murah & lebih efektif. Pasti Direkomendasikan!";
            isAccepted = true;
        } else if (dE < 0 && dC > 0) {
            decisionText = "Kuadran Barat Laut (DOMINATED):<br>Lebih mahal & kurang efektif. Pasti Ditolak!";
            isAccepted = false;
        } else if (dE > 0 && dC > 0) {
            // Kuadran Timur Laut (Trade-off)
            const icerValue = dC / dE;
            if (icerValue <= wtp) {
                decisionText = `Kuadran Timur Laut (TRADE-OFF):<br>Biaya sepadan dengan manfaat. ICER (${icerValue.toFixed(1)}) di bawah WTP. Direkomendasikan.`;
                isAccepted = true;
            } else {
                decisionText = `Kuadran Timur Laut (TRADE-OFF):<br>Terlalu mahal untuk manfaatnya. ICER (${icerValue.toFixed(1)}) melebihi WTP. Ditolak.`;
                isAccepted = false;
            }
        } else if (dE < 0 && dC < 0) {
            // Kuadran Barat Daya (Trade-off)
            const icerValue = dC / dE;
            if (icerValue >= wtp) {
                decisionText = `Kuadran Barat Daya (TRADE-OFF):<br>Penurunan biaya sepadan dengan hilangnya efektivitas. Direkomendasikan (Jarang terjadi).`;
                isAccepted = true;
            } else {
                decisionText = `Kuadran Barat Daya (TRADE-OFF):<br>Penghematan biaya tidak sebanding dengan hilangnya efektivitas. Ditolak.`;
                isAccepted = false;
            }
        } else {
            decisionText = "Tidak ada selisih yang signifikan.";
            isAccepted = false;
        }

        // Update Tampilan Kotak Keputusan
        decisionBox.innerHTML = decisionText;
        decisionBox.className = `result-box ${isAccepted ? 'terima' : 'tolak'}`;
    }

    // Pasang Event Listener ke semua slider
    sliderQALY.addEventListener('input', updateApp);
    sliderCost.addEventListener('input', updateApp);
    sliderWTP.addEventListener('input', updateApp);

    // Inisialisasi pertama kali
    updateApp();
</script>

</body>
</html>
